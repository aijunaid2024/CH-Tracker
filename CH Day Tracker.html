function allTasks(m=selectedMonth){let items=md(m).items||[];items.forEach(normalizeMonthlyGroup);return items.flatMap(g=>(g.chapters||[]).map(c=>({...c,subject:g.name,groupType:g.type})))}

function stats(a){let n=a.length,d=a.filter(x=>x.done).length;return {n,d,p:n?Math.round(d/n*100):0}}
function weekTasks(w){return (w.subjects||[]).flatMap(s=>(s.chapters||[]))}
function weekStats(w){return stats(weekTasks(w))}
function timeLogs(d=selectedDate){return db.logs[d]||[]}
function total(logs,cat){return logs.filter(x=>x.cat===cat).reduce((n,x)=>n+(+x.minutes||0),0)}
function mins(n){n=Math.max(0,Math.round(n));return `${Math.floor(n/60)}h ${n%60}m`}
function weekStart(d){let x=date(d),day=(x.getDay()+6)%7;x.setDate(x.getDate()-day);return key(x)}
function weekProgramming(d){let start=weekStart(d),end=date(start);end.setDate(end.getDate()+6);return Object.entries(db.logs).filter(([day])=>day>=start&&day<=key(end)).flatMap(([,a])=>a).filter(x=>x.cat==='programming').reduce((n,x)=>n+(+x.minutes||0),0)}
function wasteForDay(d){let a=db.logs[d]||[],cat=cat=>a.filter(x=>x.cat===cat).reduce((n,x)=>n+(+x.minutes||0),0);let sleep=Math.max(0,cat('sleep')-360),meal=Math.max(0,cat('meal')-90),religion=Math.max(0,cat('religion')-60),chess=Math.max(0,cat('chess')-30);let start=weekStart(d),day=date(d),offset=Math.round((day-date(start))/86400000),program=offset===2?Math.max(0,60-weekProgramming(d)):0;let logged=a.reduce((n,x)=>n+(+x.minutes||0),0),unallocated=Math.max(0,1440-logged);return {sleep,meal,religion,chess,program,rule:sleep+meal+religion+chess+program,unallocated,total:sleep+meal+religion+chess+program+unallocated,logged,programming:weekProgramming(d),programDue:offset>=2};}

<section class="card">${header('24-hour breakdown','All remaining unlogged time is shown as potential waste')}<div style="font-size:25px;font-weight:850;margin:12px 0">${mins(sum)} <span class="tiny muted">/ 24 hours logged</span></div><div class="progress"><span style="width:${Math.min(100,sum/1440*100)}%"></span></div><div class="tiny muted" style="margin-top:8px">${mins(w.unallocated)} unallocated · ${mins(w.rule)} rule-based excess / missed programming</div><div style="margin-top:15px">${categories.map(c=>{let n=total(logs,c[0]);if(!n)return '';return `<div class="barrow"><span>${c[1]}</span><div class="barbg"><span style="width:${Math.min(100,n/1440*100)}%;background:${c[2]}"></span></div><b>${mins(n)}</b></div>`}).join('')}</div></section></div>
<section class="card section">${header('Personal priorities','Daily religion and chess goals, plus your weekly programming goal')}<div class="barrow"><span>Religion / prayer</span><div class="barbg"><span style="width:${Math.min(100,total(logs,'religion')/60*100)}%;background:#15966a"></span></div><b>${mins(total(logs,'religion'))} / 1h</b></div><div class="barrow"><span>Chess</span><div class="barbg"><span style="width:${Math.min(100,total(logs,'chess')/30*100)}%;background:#d85d68"></span></div><b>${mins(total(logs,'chess'))} / 30m</b></div><div class="barrow"><span>Programming (week)</span><div class="barbg"><span style="width:${Math.min(100,weekProgramming(selectedDate)/60*100)}%;background:#4568df"></span></div><b>${mins(weekProgramming(selectedDate))} / 1h</b></div><p class="tiny muted">Programming week: Monday–Sunday. Complete the 1-hour target by Tuesday night to avoid the missed-target waste entry on Wednesday.</p></section>
<section class="card section">${header('Automatic waste calculation','Based on your personal time limits')}<div class="grid three"><div class="notice">Sleep over 6h: <b>${mins(w.sleep)}</b> waste</div><div class="notice">Eating over 1h 30m: <b>${mins(w.meal)}</b> waste</div><div class="notice">Religion over 1h: <b>${mins(w.religion)}</b> waste</div><div class="notice">Chess over 30m: <b>${mins(w.chess)}</b> waste</div><div class="notice">Programming missed: <b>${mins(w.program)}</b> waste ${w.programDue?'(counted on Wednesday only)':'(not due yet)'}</div><div class="notice">Unallocated: <b>${mins(w.unallocated)}</b> potential waste</div></div><p class="tiny muted">Rule-based waste = time above the sleep, eating, religion and chess limits, plus the uncompleted part of the weekly programming hour, counted once only on Wednesday if it was not completed by Tuesday night; later days do not add it again. Unallocated time is shown separately as potential waste because it may simply be time you have not entered yet.</p></section>
<section class="card section">${header('Sessions for '+fmt(selectedDate),logs.length+' saved sessions')}${logs.length?logs.slice().sort((a,b)=>a.start.localeCompare(b.start)).map(x=>{let c=categories.find(y=>y[0]===x.cat)||categories.at(-1);return `<div class="timeitem"><div><b>${esc(x.label||c[1])}</b><div class="tiny muted">${c[1]} · ${x.start}–${x.end} · ${esc(x.notes||'')}</div></div><div class="actions"><b>${mins(x.minutes)}</b><button class="btn sm danger" onclick="delLog('${selectedDate}','${x.id}')">×</button></div></div>`}).join(''):'<div class="empty">No sessions logged for this day yet.</div>'}</section>`}
function addLog(){let cat=$('#cat').value,label=$('#label').value.trim(),start=$('#start').value,end=$('#end').value;if(!start||!end){toast('Enter start and end times');return}let [sh,sm]=start.split(':').map(Number),[eh,em]=end.split(':').map(Number),a=sh*60+sm,b=eh*60+em;if(b<=a)b+=1440;let duration=b-a;if(duration>1440){toast('Session cannot exceed 24 hours');return}let logs=timeLogs();if(logs.reduce((n,x)=>n+(+x.minutes||0),0)+duration>1440){toast('Logged sessions would exceed 24 hours. Check your entries.');return}logs.push({id:uid(),cat,label:label||categories.find(x=>x[0]===cat)[1],start,end,minutes:duration,notes:$('#notes').value.trim()});db.logs[selectedDate]=logs;save();toast('Session saved');render()}
function delLog(d,id){if(!confirm('Delete this time session?'))return;db.logs[d]=(db.logs[d]||[]).filter(x=>x.id!==id);save();render()}
function analytics(){let tasks=allTasks(),st=stats(tasks),entries=Object.entries(db.logs).filter(([d])=>month(d)===selectedMonth),logs=entries.flatMap(([,a])=>a),sum=logs.reduce((n,x)=>n+x.minutes,0),days=entries.length,subjectNames=[...new Set(tasks.map(x=>x.subject))],waste=entries.reduce((n,[d])=>n+wasteForDay(d).total,0),ruleWaste=entries.reduce((n,[d])=>n+wasteForDay(d).rule,0),unalloc=entries.reduce((n,[d])=>n+wasteForDay(d).unallocated,0),byCat=categories.map(c=>({id:c[0],name:c[1],color:c[2],minutes:logs.filter(x=>x.cat===c[0]).reduce((n,x)=>n+(+x.minutes||0),0)})).filter(x=>x.minutes);return `<div class="row" style="margin-bottom:14px"><div><div class="eyebrow">YOUR PROGRESS REPORT</div><h2 style="margin:3px 0">Charts & analytics</h2></div><input type="month" value="${selectedMonth}" onchange="changeMonth(this.value)" style="padding:9px;border:1px solid var(--line);border-radius:9px"></div>
<div class="grid stats">${stat('🎯','Target completion',st.p+'%',`${st.d}/${st.n} tasks`)}${stat('⚠️','Estimated waste',mins(waste),'tracked days')}${stat('📅','Days tracked',days,'days with logs')}${stat('📚','Subjects',subjectNames.length,'with tasks')}</div>
<div class="grid two"><section class="card">${header('Waste breakdown','Rule-based excess vs unallocated time')}<div class="barrow"><span>Rule-based</span><div class="barbg"><span style="width:${waste?ruleWaste/waste*100:0}%;background:#d85d68"></span></div><b>${mins(ruleWaste)}</b></div><div class="barrow"><span>Unallocated</span><div class="barbg"><span style="width:${waste?unalloc/waste*100:0}%;background:#e49a36"></span></div><b>${mins(unalloc)}</b></div><p class="tiny muted">Unallocated time is potential waste until you finish entering the full day.</p><canvas class="chart" id="wasteTrend" width="900" height="230"></canvas></section>
<section class="card">${header('How you used your time','Recorded time by activity')}${byCat.length?byCat.map(c=>`<div class="barrow"><span>${c.name}</span><div class="barbg"><span style="width:${sum?c.minutes/sum*100:0}%;background:${c.color}"></span></div><b>${mins(c.minutes)}</b></div>`).join(''):'<div class="empty">No time records for this month.</div>'}</section></div>
<section class="card section">${header('Daily study-time trend','Self study, tuition and coaching combined')}<canvas class="chart" id="trend" width="900" height="230"></canvas></section>
<section class="card section">${header('Monthly time totals','Recorded time by activity category')}${byCat.length?byCat.map(c=>`<div class="timeitem"><span>${c.name}</span><b>${mins(c.minutes)} · ${sum?Math.round(c.minutes/sum*100):0}%</b></div>`).join(''):'<div class="empty">No data yet.</div>'}</section>
<section class="card section">${header('Study & target completion','Checklist progress')}<div style="font-size:30px;font-weight:850">${st.p}%</div>${bar(st.p)}<p class="tiny muted">${st.d} tasks done, ${st.n-st.d} remaining</p>${subjectNames.map(name=>{let q=stats(tasks.filter(x=>x.subject===name));return `<div class="barrow" style="grid-template-columns:110px 1fr 45px"><span>${esc(name)}</span><div class="barbg"><span style="width:${q.p}%;background:var(--blue)"></span></div><b>${q.p}%</b></div>`}).join('')}</section>`}
function drawTrend(){let [y,m]=selectedMonth.split('-').map(Number),n=new Date(y,m,0).getDate();let c=$('#trend');if(c){let ctx=c.getContext('2d'),w=c.width;ctx.clearRect(0,0,w,c.height);let vals=Array.from({length:n},(_,i)=>{let d=`${selectedMonth}-${String(i+1).padStart(2,'0')}`,a=db.logs[d]||[];return a.filter(x=>['self','tuition','coaching'].includes(x.cat)).reduce((s,x)=>s+x.minutes,0)}),max=Math.max(60,...vals),step=w/n;ctx.font='11px system-ui';vals.forEach((v,i)=>{let bh=v/max*155,x=i*step+step*.18,bw=Math.max(3,step*.62);ctx.fillStyle='#4568df';ctx.fillRect(x,180-bh,bw,bh);if(n<=15||i%3===0){ctx.fillStyle='#718096';ctx.textAlign='center';ctx.fillText(String(i+1),x+bw/2,200)}});ctx.strokeStyle='#e5eaf2';ctx.beginPath();ctx.moveTo(0,181);ctx.lineTo(w,181);ctx.stroke()}let wc=$('#wasteTrend');if(wc){let ctx=wc.getContext('2d'),w=wc.width;ctx.clearRect(0,0,w,wc.height);let vals=Array.from({length:n},(_,i)=>{let d=`${selectedMonth}-${String(i+1).padStart(2,'0')}`;return db.logs[d]?wasteForDay(d).total:0}),max=Math.max(60,...vals),step=w/n;ctx.font='11px system-ui';vals.forEach((v,i)=>{let bh=v/max*155,x=i*step+step*.18,bw=Math.max(3,step*.62);ctx.fillStyle='#d85d68';ctx.fillRect(x,180-bh,bw,bh);if(n<=15||i%3===0){ctx.fillStyle='#718096';ctx.textAlign='center';ctx.fillText(String(i+1),x+bw/2,200)}});ctx.strokeStyle='#e5eaf2';ctx.beginPath();ctx.moveTo(0,181);ctx.lineTo(w,181);ctx.stroke()}}
function settings(){return `<section class="card"><div class="field"><label>YOUR NAME (OPTIONAL)</label><input id="name" value="${esc(db.profile.name)}" placeholder="Your name"></div><button class="btn primary" onclick="saveProfile()">Save settings</button><hr style="border:0;border-top:1px solid var(--line);margin:18px 0"><div class="grid"><button class="btn" onclick="backup()">Download full backup (JSON)</button><label class="btn" style="text-align:center">Restore backup<input hidden type="file" accept=".json,application/json" onchange="restore(this.files[0])"></label><button class="btn" onclick="csv()">Export time log (CSV)</button><button class="btn danger" onclick="clearAll()">Delete all data</button></div><p class="notice" style="margin-top:14px">Your information is stored only in this browser on this device. It is not automatically synced to another device. Download backups regularly, especially before clearing browser data.</p></section>`}
function render(){let fn={targets,syllabus:syllabusPage,time:timePage,analytics,settings};$('#app').innerHTML=fn[page]();$('#title').textContent=({targets:'Targets & checklist',syllabus:'HSC syllabus tracker',time:'Time & waste tracker',analytics:'Charts & analytics',settings:'Backup & settings'})[page];$('#today').textContent=fmt(today());if(page==='analytics')drawTrend()}
function go(p){page=p;$('#side').classList.remove('open');document.querySelectorAll('.nav button').forEach(b=>b.classList.toggle('active',b.dataset.page===p));render()}
function changeMonth(v){if(!v)return;selectedMonth=v;render()}
function saveProfile(){db.profile.name=$('#name').value.trim();save();toast('Settings saved')}
function backup(){download(new Blob([JSON.stringify(db,null,2)],{type:'application/json'}),`daytrack-backup-${today()}.json`)}
function restore(file){if(!file)return;let r=new FileReader();r.onload=()=>{try{let x=JSON.parse(r.result);if(x.version!==1||!x.months||!x.logs)throw 0;db=x;save();render();toast('Backup restored')}catch(e){toast('Invalid backup file')}};r.readAsText(file)}
function csv(){let rows=[['Date','Category','Activity','Start','End','Minutes','Notes']];Object.entries(db.logs).sort().forEach(([d,a])=>a.forEach(x=>rows.push([d,x.cat,x.label,x.start,x.end,x.minutes,x.notes||''])));let data=rows.map(r=>r.map(x=>'"'+String(x).replace(/"/g,'""')+'"').join(',')).join('\n');download(new Blob(['\ufeff'+data],{type:'text/csv'}),`daytrack-time-${today()}.csv`)}
function download(blob,name){let a=document.createElement('a'),u=URL.createObjectURL(blob);a.href=u;a.download=name;a.click();setTimeout(()=>URL.revokeObjectURL(u),1000)}
function clearAll(){if(!confirm('Permanently delete all DayTrack data in this browser?'))return;db=fresh();save();render();toast('All data cleared')}
$('#nav').addEventListener('click',e=>{let b=e.target.closest('button[data-page]');if(b)go(b.dataset.page)});$('#menu').addEventListener('click',()=>$('#side').classList.toggle('open'));
Object.assign(window,{go,changeMonth,addWeek,addSubject,addPresetSubject,previewMonthlySubject,previewWeeklySubject,setPickerChecks,commitPicker,toggleChapter,delWeek,delSubject,addMonthGroup,addMonthlyPreset,toggleMonthChapter,delMonthGroup,addLog,delLog,saveProfile,backup,restore,csv,clearAll,toggleSyllabusChapter,addCustomSyllabusSubject,toggleCustomSyllabusChapter,deleteCustomSyllabusSubject,filterSyllabus});
render();
})();
</script></body></html>
